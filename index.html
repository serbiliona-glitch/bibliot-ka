  --F-system:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, sans-serif;
  --F-manrope:"Manrope", -apple-system, "Helvetica Neue", sans-serif;
  --F-nunito:"Nunito", -apple-system, "Helvetica Neue", sans-serif;
  --F-ptsans:"PT Sans", -apple-system, "Helvetica Neue", sans-serif;
  --tabh:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Зелений: світлий або темний, як на iPhone */
:root, :root[data-theme="green"]{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface2:#E7E9E3; --ink:#1B2220; --muted:#5E6964;
  --line:#D9DCD4; --accent:#2D6A52; --accent-ink:#FFFFFF; --accent-soft:#DCEAE2;
  --gold:#A8711A; --danger:#B3402F; --serif:var(--F-literata); --sans:var(--F-system); color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]), :root[data-theme="green"]{
    --bg:#101513; --surface:#1A211E; --surface2:#252E2A; --ink:#E6ECE8; --muted:#95A09B;
    --line:#2F3934; --accent:#74C49E; --accent-ink:#0D1A13; --accent-soft:#1F3a2E;
    --gold:#E2B45C; --danger:#E3735F; color-scheme:dark;
  }
}
/* Беж і шоколад */
:root[data-theme="warm"]{
  --bg:#EFE6DA; --surface:#FAF5EE; --surface2:#E3D6C5; --ink:#3A2419; --muted:#735D4C;
  --line:#DCCDB9; --accent:#5A3524; --accent-ink:#FAF5EE; --accent-soft:#EAD9C3;
  --gold:#94601E; --danger:#A2402C; --serif:var(--F-cormorant); --sans:var(--F-manrope); color-scheme:light;
}
/* Пудровий */
:root[data-theme="powder"]{
  --bg:#F7EEEC; --surface:#FFFAF9; --surface2:#EEDCD8; --ink:#3B2A2E; --muted:#765D62;
  --line:#EBD9D5; --accent:#A0526A; --accent-ink:#FFFFFF; --accent-soft:#F3DDE1;
  --gold:#9A6128; --danger:#B03A48; --serif:var(--F-lora); --sans:var(--F-nunito); color-scheme:light;
}
/* Темно-синій і золото */
:root[data-theme="navy"]{
  --bg:#0F1A2E; --surface:#172440; --surface2:#22314F; --ink:#EFE8D8; --muted:#A6ACBA;
  --line:#26365A; --accent:#D4AF6A; --accent-ink:#1A1405; --accent-soft:#2A3550;
  --gold:#D4AF6A; --danger:#E88A78; --serif:var(--F-playfair); --sans:var(--F-ptsans); color-scheme:dark;
}
/* Синій і мідь — як іконка */
:root[data-theme="copper"]{
  --bg:#101B33; --surface:#18264A; --surface2:#233459; --ink:#F1E9DF; --muted:#AEB3C2;
  --line:#2A3B63; --accent:#DE9E6E; --accent-ink:#1C1009; --accent-soft:#2E3A5C;
  --gold:#E8B48A; --danger:#EE8E7C; --serif:var(--F-playfair); --sans:var(--F-ptsans); color-scheme:dark;
}
/* Шрифти, вибрані вручну, мають перевагу над шрифтами теми */
:root[data-dfont="literata"]{--serif:var(--F-literata)}
:root[data-dfont="cormorant"]{--serif:var(--F-cormorant)}
:root[data-dfont="lora"]{--serif:var(--F-lora)}
:root[data-dfont="playfair"]{--serif:var(--F-playfair)}
:root[data-bfont="system"]{--sans:var(--F-system)}
:root[data-bfont="manrope"]{--sans:var(--F-manrope)}
:root[data-bfont="nunito"]{--sans:var(--F-nunito)}
:root[data-bfont="ptsans"]{--sans:var(--F-ptsans)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
main{max-width:760px;margin:0 auto;padding:12px 18px calc(var(--tabh) + 32px)}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:30px 0 12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:24px;height:24px}

/* ---------- book cover: the one memorable object ---------- */
.cover{position:relative;aspect-ratio:2/3;border-radius:2px 6px 6px 2px;overflow:hidden;background:var(--surface2);
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 18px -8px rgba(0,0,0,.35);container-type:inline-size;flex-shrink:0}
.cover::after{content:"";position:absolute;inset:0 auto 0 0;width:7%;
  background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.10) 55%,transparent);pointer-events:none}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.ph{background:var(--c);color:#F3EEE3;display:flex;flex-direction:column;justify-content:space-between;padding:13% 9% 11% 15%}
.ph-t{font-family:var(--serif);font-weight:600;font-size:12.5cqw;line-height:1.14;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;word-break:break-word}
.ph-a{font-size:8.5cqw;opacity:.82;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ---------- home ---------- */
.counts{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.counts > div{padding:14px 16px;border-bottom:1px solid var(--line)}
.counts > div:nth-child(odd){border-right:1px solid var(--line)}
.counts > .wide{grid-column:1/-1;border-right:0;border-bottom:0;display:flex;align-items:baseline;justify-content:space-between}
.num{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1;display:block}
.lbl{font-size:14px;color:var(--muted)}
.big-add{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin-top:16px;border-radius:16px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:18px}
.big-add:active{filter:brightness(.92)}
.reading{display:flex;gap:14px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;width:100%;text-align:left}
.reading .cover{width:62px}
.r-info{flex:1;min-width:0}
.r-title{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.r-author{color:var(--muted);font-size:14px;margin-top:2px}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:10px 0 6px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
.r-nums{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.r-nums b{color:var(--ink);font-weight:600}
.shelf{display:flex;gap:14px;overflow-x:auto;padding:4px 18px 14px;margin:0 -18px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.shelf > button{width:96px;flex-shrink:0;scroll-snap-align:start;text-align:left}
.shelf .t{font-size:13px;margin-top:8px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{padding:22px 18px;border:1.5px dashed var(--line);border-radius:16px;color:var(--muted);font-size:15px;text-align:center}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);margin-bottom:14px;font-size:14px}
.banner button{margin-left:auto;font-weight:600;color:var(--accent);white-space:nowrap;min-height:36px}

/* ---------- library ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:48px}
.search svg{width:20px;height:20px;color:var(--muted);flex-shrink:0}
.search input{flex:1;border:0;background:transparent;outline:none;min-height:46px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 0;padding:0 18px 4px}
.chip{flex-shrink:0;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:15px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 12px;gap:10px}
.tool-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--surface2);font-size:15px;font-weight:500}
.tool-btn .dot{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;display:grid;place-items:center;padding:0 5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:22px 16px}
.card{text-align:left;display:block;width:100%}
.card .title{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.25;margin-top:10px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .author{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;white-space:nowrap}
.st-want{background:var(--surface2);color:var(--muted)}
.st-reading{background:var(--accent-soft);color:var(--accent)}
.st-read{background:var(--ink);color:var(--bg)}
.st-dropped{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px currentColor}
.rate{font-size:13px;font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.fav-mark{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:2}
.fav-mark svg{width:15px;height:15px;color:#fff}

/* ---------- lists ---------- */
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row .cover{width:56px}
.row .r-info{cursor:pointer}
.btn{min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--surface2)}
.btn-danger{color:var(--danger);background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn-wide{width:100%;min-height:54px;font-size:17px;border-radius:14px}

/* ---------- stats ---------- */
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-size:15px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 12px 10px}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px}
.bars > div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 1px 1px;min-height:2px}
.bars i.zero{background:var(--surface2)}
.bars .v{font-size:11px;color:var(--muted);margin-bottom:3px;font-variant-numeric:tabular-nums}
.bars-l{display:flex;gap:4px;margin-top:6px}
.bars-l span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);min-width:0;overflow:hidden}
.facts{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.fact{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact span{color:var(--muted);font-size:15px}
.fact b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.fact small{display:block;font-weight:400;color:var(--muted);font-size:13px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  padding:6px 4px env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--surface) 88%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;color:var(--muted);font-size:11px;font-weight:500}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-current="page"]{color:var(--accent)}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:54px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-bar .ttl{font-weight:600;font-size:17px;text-align:center}
.bar-btn{min-height:44px;padding:0 10px;color:var(--accent);font-size:17px;justify-self:start}
.bar-btn.r{justify-self:end}
.bar-btn.strong{font-weight:600}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 40px)}
.sheet-body > .in{max-width:640px;margin:0 auto}

/* detail */
.d-head{display:flex;flex-direction:column;align-items:center;text-align:center}
.d-head .cover{width:min(52vw,210px)}
.d-title{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.2;margin:20px 0 4px}
.d-author{color:var(--muted);font-size:17px}
.d-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tag{font-size:14px;padding:5px 11px;border-radius:9px;background:var(--surface2)}
.fav-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:5px 11px;border-radius:9px;background:var(--surface2)}
.fav-btn svg{width:16px;height:16px}
.fav-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.block h3{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 8px}
.big-prog{font-family:var(--serif);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.big-prog span{font-size:17px;color:var(--muted);font-weight:400;font-family:var(--sans)}
.pct{float:right;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--accent)}
.pg-row{display:flex;gap:10px;margin-top:12px}
.pg-row input{flex:1;min-width:0}
.text{white-space:pre-wrap;line-height:1.55;font-family:var(--serif);font-size:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

/* form */
.field{margin-bottom:16px}
.field > label,.flabel{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;-webkit-appearance:none;appearance:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cover-pick{display:flex;gap:16px;align-items:center}
.cover-pick .cover{width:96px}
.cover-pick .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.rating{display:flex;gap:4px}
.rating button{flex:1;min-height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.rating button.on{background:var(--gold);border-color:var(--gold);color:#fff}
.switch-row{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:0 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.switch{width:52px;height:32px;border-radius:16px;background:var(--surface2);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-size:14px;margin-top:6px}

/* dialog + toast */
.dlg-back{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:24px}
.dlg{background:var(--surface);border-radius:18px;padding:20px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg p{margin:0 0 18px;font-size:16px;line-height:1.45}
.dlg .acts{display:flex;gap:10px}
.dlg .acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:80;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}

/* ---------- v2: головна ---------- */
.date{font-size:14px;color:var(--muted)}
.today{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--accent-soft);border-radius:18px;margin-top:6px}
.today .n{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.today .t{font-size:15px;line-height:1.3}
.today .t span{color:var(--muted)}
.insights{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.4}
.insight:last-child{border-bottom:0}
.insight::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:7px}
.insight.warn::before{background:var(--gold)}
.rcard{display:flex;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}
.rcard > .cover{width:84px;cursor:pointer}
.rcard .r-info{display:flex;flex-direction:column;gap:3px}
.rcard .r-title{font-size:18px;cursor:pointer}
.chipline{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini{font-size:12px;font-weight:600;padding:4px 8px;border-radius:8px;background:var(--surface2)}
.mini.acc{background:var(--accent-soft);color:var(--accent)}
.rec-btn{margin-top:10px;min-height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;width:100%}
.month{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.month-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.month-h h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:0}
.month-h .sub{font-size:13px}
.dbars{display:flex;align-items:flex-end;gap:2px;height:90px}
.dbars i{flex:1;display:block;min-width:0;border-radius:3px 3px 1px 1px;background:var(--accent)}

.mstats b{display:block;font-family:var(--serif);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}

.year-row{display:flex;justify-content:space-between;align-items:center;padding:18px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:26px}

/* коротка примітка курсивом */

.d-label{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--accent);margin-top:6px}

.lchips button{min-height:36px;padding:0 12px;border-radius:18px;background:var(--surface2);font-family:var(--serif);font-style:italic;font-size:14px}

.next{display:flex;gap:14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px}

.next .btn{margin-top:8px;align-self:flex-start}
.quote{position:relative;padding:22px 20px 18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.quote::before{content:"\201C";position:absolute;top:-6px;left:14px;font-family:var(--serif);font-size:72px;line-height:1;color:var(--accent);opacity:.9}
.quote p{margin:10px 0 12px;font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.5;white-space:pre-wrap}
.quote .src{font-size:14px;color:var(--muted)}
.mshelf{position:relative;display:flex;gap:10px;align-items:flex-end;overflow-x:auto;padding:14px 16px 0;margin:0 -2px;min-height:150px}
.mshelf > button{width:78px;flex-shrink:0}

/* обкладинка з картинкою поверх запасної */

/* запис сторінок */

/* пошук і сканування */

.lookup button{min-height:56px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}

/* вибір теми */

<body>
<main id="app"><div class="loading">Відкриваю бібліотеку…</div></main>

<nav class="tabbar" id="tabbar" aria-label="Розділи">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>Головна</button>
  <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><path d="m16.5 5.2 3.8-1 3 15.5-3.8 1z" transform="translate(-2.5 0)"/></svg>Бібліотека</button>
  <button data-tab="want"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"/></svg>Хочу</button>
  <button data-tab="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>Улюблені</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Статистика</button>
</nav>

<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<script>
/* =========================================================
   Моя бібліотека — версія 1
   Структура:
   1) Модель книги (які поля зберігаємо)
   2) Сховище (Store): акаунт Claude або цей пристрій
   3) Екрани: Головна, Бібліотека, Хочу, Улюблені, Статистика
   4) Картка книги, форма, налаштування, експорт/імпорт
   ========================================================= */

const SCHEMA_VERSION = 1;
const STATUS = { want:'Хочу прочитати', reading:'Читаю', read:'Прочитана', dropped:'Кинула' };
const STATUS_KEYS = ['want','reading','read','dropped'];
const MONTHS = ['Січ','Лют','Бер','Кві','Тра','Чер','Лип','Сер','Вер','Жов','Лис','Гру'];
const MONTHS_NOM = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const COVER_COLORS = ['#35524A','#6B4E3D','#3F4E6B','#7A3E48','#4F6B3F','#5B4A6E','#8A6A2F','#2F5F6B','#6E3F5C'];

const THIS_YEAR = new Date().getFullYear();
const state = { tab:'home', q:'', status:'all', label:'', author:'', genre:'', minRating:0, sort:'title', dir:'asc', period:'since', month:'' };
let books = [];
let DL = null; // можливість зберігати файли

/* ---------- дрібні помічники ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const find = id => books.find(b => b.id === id);
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function newId(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function plural(n,one,few,many){ const a=n%10,b=n%100; if(a===1&&b!==11) return one; if(a>=2&&a<=4&&(b<12||b>14)) return few; return many; }
function fmtDate(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return `${+d} ${['січ.','лют.','бер.','квіт.','трав.','черв.','лип.','серп.','вер.','жовт.','лист.','груд.'][+m-1]} ${y}`; }
function fmtNum(n){ return Number(n||0).toLocaleString('uk-UA'); }
function hash(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); }
function pct(b){ if(b.status==='read') return 100; if(!b.pages) return 0; return Math.min(100, Math.round((b.currentPage||0)/b.pages*100)); }
function dayKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(key,n){ const d=new Date(key+'T12:00:00'); d.setDate(d.getDate()+n); return dayKey(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5); }
const thisMonth = () => today().slice(0,7);
const MONTHS_GEN = ['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'];
const MONTHS_LOC = ['січні','лютому','березні','квітні','травні','червні','липні','серпні','вересні','жовтні','листопаді','грудні'];
/* з якого місяця ведеться облік (за замовчуванням — серпень 2026) */
function since(){ let v='2026-08'; try{ v=localStorage.getItem('lib-since')||v; }catch(e){} return /^\d{4}-\d{2}$/.test(v)?v:'2026-08'; }
function sinceLabel(){ const [y,m]=since().split('-'); return `з ${MONTHS_GEN[+m-1]} ${y}`; }
function monthLabel(ym){ const [y,m]=ym.split('-'); return MONTHS_NOM[+m-1]+' '+y; }
function shiftMonth(ym,n){ let [y,m]=ym.split('-').map(Number); m+=n; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+'-'+String(m).padStart(2,'0'); }
/* скільки сторінок прочитано кожного дня (з усіх книг разом) */
function dailyTotals(){ const t={}; books.forEach(b=>{ for(const k in (b.log||{})) t[k]=(t[k]||0)+b.log[k]; }); return t; }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

function askConfirm(text, okLabel='Так', danger=false){
  return new Promise(res=>{
    const back=document.createElement('div'); back.className='dlg-back';
    back.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><p>${esc(text)}</p><div class="acts">
      <button class="btn btn-soft" data-v="0">Скасувати</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" data-v="1">${esc(okLabel)}</button></div></div>`;
    back.addEventListener('click',e=>{ const v=e.target.closest('[data-v]'); if(v||e.target===back){ back.remove(); res(!!(v&&v.dataset.v==='1')); }});
    document.body.appendChild(back);
  });
}

/* =========================================================
   1) МОДЕЛЬ КНИГИ
   Поля isbn і quotes порожні — вони чекають на майбутні функції
   (сканування штрихкоду, цитати), щоб не міняти структуру даних.
   ========================================================= */
function blankBook(){
  return { id:newId(), title:'', author:'', genre:'', pages:0, currentPage:0, status:'want',
    startDate:'', endDate:'', rating:null, description:'', notes:'', favorite:false, cover:'',
    label:'', isbn:'', quotes:[], log:{}, createdAt:'', updatedAt:'' };
}
function normalize(b, auto=true){
  b.title=String(b.title||'').trim(); b.author=String(b.author||'').trim(); b.genre=String(b.genre||'').trim(); b.label=String(b.label||'').trim().slice(0,120);
  b.pages=Math.max(0,parseInt(b.pages)||0);
  b.currentPage=Math.max(0,parseInt(b.currentPage)||0);
  if(!STATUS[b.status]) b.status='want';
  if(b.pages && b.currentPage>b.pages) b.currentPage=b.pages;
  if(b.status==='read'){ if(b.pages) b.currentPage=b.pages; if(auto && !b.endDate) b.endDate=today(); }
  if(b.status==='reading' && auto && !b.startDate) b.startDate=today();
  const r=parseInt(b.rating); b.rating = r>=1 ? Math.min(10,r) : null;
  b.favorite=!!b.favorite;
  if(typeof b.cover!=='string' || !(b.cover.startsWith('data:image/') || b.cover.startsWith('https://'))) b.cover='';
  /* журнал читання: { "2026-09-23": 17 } — скільки сторінок цієї книги прочитано того дня */
  const log={}; if(b.log && typeof b.log==='object' && !Array.isArray(b.log)){
    for(const k in b.log){ const v=parseInt(b.log[k]); if(/^\d{4}-\d{2}-\d{2}$/.test(k) && v>0) log[k]=Math.min(v,5000); } }
  b.log=log;
  b.quotes = (Array.isArray(b.quotes)?b.quotes:[]).filter(x=>x&&typeof x.text==='string'&&x.text.trim())
    .map(x=>({ text:x.text.trim().slice(0,3000), page: parseInt(x.page)>0?parseInt(x.page):null, added: typeof x.added==='string'?x.added:today() })).slice(0,500);
  if(typeof b.isbn!=='string') b.isbn='';
  b.updatedAt=new Date().toISOString(); if(!b.createdAt) b.createdAt=b.updatedAt;
  return b;
}

/* =========================================================
   2) СХОВИЩЕ
   Якщо сторінка відкрита в Claude — книги зберігаються у вашому
   акаунті (особисто для вас, навіть якщо хтось отримає посилання).
   Якщо файл відкрито окремо — у пам'яті цього браузера.
   ========================================================= */
const Store = {
  mode:'loading', coll:null, metaRef:null, idb:null, meta:{},
  async init(){
    let db=null, user=null, uid=null;
    if(window.claude && typeof window.claude.use==='function'){
      try{
        [db,user,DL] = await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
        if(user) uid = await user.id();
      }catch(e){}
    }
    if(db && uid){
      this.mode='cloud';
      this.metaRef = db.doc('data/users/'+uid+'/library');
      this.coll = this.metaRef.collection('books');
      try{ const m=await this.metaRef.get(); this.meta = m.exists ? {...m.data()} : {}; }catch(e){ this.meta={}; }
      this.coll.onSnapshot(
        snap => { books = snap.docs.map(d=>({...d.data(), id:d.id})); ready(); },
        () => toast('Зв\u2019язок перервався. Перезавантажте сторінку.')
      );
    } else {
      this.mode='local';
      try{ this.idb = await idbOpen(); books = await idbAll(this.idb); }
      catch(e){ this.mode='memory'; books=[]; toast('Цей браузер не дозволяє зберігати дані. Зробіть експорт перед закриттям.'); }
      try{ this.meta = JSON.parse(localStorage.getItem('lib-meta')||'{}'); }catch(e){ this.meta={}; }
      try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
      ready();
    }
  },
  async put(b, silent=false){
    const clean = clone(b);
    if(this.mode==='cloud'){ await retry(()=>this.coll.doc(clean.id).set(clean)); return; }
    if(this.mode==='local') await idbPut(this.idb, clean);
    const i=books.findIndex(x=>x.id===clean.id); if(i>=0) books[i]=clean; else books.push(clean);
    if(!silent) refresh();
  },
  async remove(id){
    if(this.mode==='cloud'){ await retry(()=>this.coll.doc(id).delete()); return; }
    if(this.mode==='local') await idbDel(this.idb, id);
    books = books.filter(b=>b.id!==id); refresh();
  },
  async setMeta(patch){
    Object.assign(this.meta, patch);
    if(this.mode==='cloud'){ try{ await this.metaRef.set({...this.meta}); }catch(e){} }
    else { try{ localStorage.setItem('lib-meta', JSON.stringify(this.meta)); }catch(e){} }
  }
};
async function retry(fn){
  for(let i=0;i<4;i++){
    try{ return await fn(); }
    catch(e){
      const c=e&&e.code;
      if(c==='quota_exceeded'){ toast('Досягнуто ліміт сховища. Видаліть непотрібні книги.'); throw e; }
      if(i===3 || (c && c!=='unavailable' && c!=='resource_exhausted')){ toast('Не вдалося зберегти. Спробуйте ще раз.'); throw e; }
      await sleep(600*(i+1)+Math.random()*300);
    }
  }
}
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('moya-biblioteka',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('books',{keyPath:'id'}); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function idbReq(db,mode,fn){ return new Promise((res,rej)=>{ const tx=db.transaction('books',mode); const rq=fn(tx.objectStore('books'));
  tx.oncomplete=()=>res(rq&&rq.result); tx.onerror=()=>rej(tx.error); }); }
const idbAll=db=>idbReq(db,'readonly',s=>s.getAll());
const idbPut=(db,b)=>idbReq(db,'readwrite',s=>s.put(b));
const idbDel=(db,id)=>idbReq(db,'readwrite',s=>s.delete(id));

let isReady=false;
function ready(){ isReady=true; refresh(); }
function refresh(){ if(!isReady) return; renderMain(); sheets.forEach(s=>s.render && !(enriching && s.isSettings) && s.render()); }

/* =========================================================
   3) ЕКРАНИ
   ========================================================= */
function coverHTML(b, extra=''){
  const fav = b.favorite && extra.includes('with-fav') ? `<span class="fav-mark" aria-label="Улюблена"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg></span>` : '';
  const c=COVER_COLORS[hash((b.title||'')+(b.author||''))%COVER_COLORS.length];
  const img = b.cover ? `<img class="cv" src="${esc(b.cover)}" alt="" onerror="this.remove()">` : '';
  return `<div class="cover ph" style="--c:${c}">${fav}${img}<span class="ph-t">${esc(b.title||'Без назви')}</span><span class="ph-a">${esc(b.author)}</span></div>`;
}
const pill = s => `<span class="pill st-${s}">${STATUS[s]}</span>`;

/* ---------- Місяць: сторінки по днях ---------- */
function monthData(ym){
  const [y,m]=ym.split('-').map(Number), n=new Date(y,m,0).getDate(), tot=dailyTotals(), t=today();
  const days=[]; for(let d=1; d<=n; d++){ const k=ym+'-'+String(d).padStart(2,'0'); days.push({k, v:tot[k]||0, future:k>t, today:k===t}); }
  const read=days.filter(d=>d.v>0), total=read.reduce((s,d)=>s+d.v,0);
  return { days, total, daysRead:read.length, avg: read.length?Math.round(total/read.length):0, best: read.length?Math.max(...read.map(d=>d.v)):0 };
}
function monthHTML(ym, nav){
  const d=monthData(ym), mx=Math.max(1,...d.days.map(x=>x.v)), n=d.days.length;
  const head = nav ? `<div class="month-h"><button class="nav-btn" onclick="goMonth(-1)" aria-label="Попередній місяць">‹</button>
      <h3>${monthLabel(ym)}</h3><button class="nav-btn" onclick="goMonth(1)" aria-label="Наступний місяць" ${ym>=thisMonth()?'disabled':''}>›</button></div>`
    : `<div class="month-h"><span class="sub">сторінки по днях</span></div>`;
  return `<div class="month">${head}
    <div class="dbars">${d.days.map(x=>`<i class="${x.future?'f':x.v?'':'z'}${x.today?' td':''}" style="height:${x.future||!x.v?4:Math.max(5,Math.round(x.v/mx*90))}px" title="${x.v} с."></i>`).join('')}</div>
    <div class="dlabels"><span>1</span><span>10</span><span>20</span><span>${n}</span></div>
    ${d.total ? `<div class="mstats"><div><b>${fmtNum(d.total)}</b><span>сторінок за місяць</span></div><div><b>${d.daysRead}</b><span>${plural(d.daysRead,'день','дні','днів')} читання</span></div>
      <div><b>${d.avg}</b><span>у середньому за день читання</span></div><div><b>${d.best}</b><span>найкращий день</span></div></div>`
      : `<p class="hint" style="margin:12px 0 0">Цього місяця ще немає записаних сторінок.</p>`}</div>`;
}
function goMonth(n){ state.month=shiftMonth(state.month||thisMonth(), n); if(state.month>thisMonth()) state.month=thisMonth(); renderMain(); }

/* ---------- Підказки про ритм читання ---------- */
function insights(){
  const out=[], t=today(), tot=dailyTotals();
  const keys=Object.keys(tot).filter(k=>tot[k]>0).sort();
  const first=keys[0], lastDay=keys[keys.length-1];
  const sum=(from,to)=>{ let s=0; for(let i=from;i<=to;i++) s+=tot[addDays(t,-i)]||0; return s; };
  const reading=books.filter(b=>b.status==='reading');
  const want=books.filter(b=>b.status==='want').length;
  const q=s=>`«${esc(s)}»`;

  const fin=books.filter(b=>b.status==='read'&&b.endDate&&b.endDate>=addDays(t,-13)&&b.endDate<=t).length;
  if(fin) out.push({html:`За останні 2 тижні ви дочитали ${fin} ${plural(fin,'книгу','книги','книг')}.`});

  const gap = lastDay ? daysBetween(lastDay,t) : null;
  let streak=0, d = tot[t] ? t : addDays(t,-1); while(tot[d]>0){ streak++; d=addDays(d,-1); }
  if(reading.length && gap!=null && gap>=3) out.push({warn:true, html:`Ви не читали ${gap} ${plural(gap,'день','дні','днів')}. ${q(reading[0].title)} чекає на вас.`});
  else if(streak>=3) out.push({html:`Ви читаєте ${streak} ${plural(streak,'день','дні','днів')} поспіль. Так тримати!`});

  if(first && first<=addDays(t,-13)){
    const w1=sum(0,6), w0=sum(7,13);
    if(w0>0 && w1<w0*0.7) out.push({warn:true, html:`Активність знизилася: ${w1} с. за цей тиждень проти ${w0} минулого.`});
    else if(w0>0 && w1>w0*1.3) out.push({html:`Ви читаєте більше: ${w1} с. за цей тиждень проти ${w0} минулого.`});
  }

  reading.forEach(b=>{ const left=b.pages-(b.currentPage||0); if(b.pages && left>0 && left<=30) out.push({html:`До кінця ${q(b.title)} лишилось лише ${left} с.`}); });

  if(first && reading.length){
    const span=Math.min(14, daysBetween(first,t)+1);
    const pace = span>=3 ? sum(0,span-1)/span/reading.length : 0;
    const b=reading.filter(b=>b.pages && b.pages-(b.currentPage||0)>30).sort((a,b)=>pct(b)-pct(a))[0];
    if(pace>=1 && b){ const n=Math.ceil((b.pages-(b.currentPage||0))/pace); if(n<=365) out.push({html:`За вашим темпом ${q(b.title)} ви дочитаєте приблизно за ${n} ${plural(n,'день','дні','днів')}.`}); }
  }

  if(want) out.push({html: want===1 ? 'Ще одна книга чекає в черзі.' : `Ще ${want} ${plural(want,'книга чекає','книги чекають','книг чекають')} в черзі.`});
  if(!out.length) out.push({html:'Записуйте сторінки, коли читаєте, і тут з\u2019являться підказки про ваш ритм.'});
  return out.slice(0,3);
}

function wireLibrary(){

    state.status=c.dataset.st; document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed', x===c)); updateGrid(); });

function sortVal(b,k){
  if(k==='title'||k==='author'){ const v=(b[k]||'').trim(); return v||null; }
  if(k==='rating') return b.rating||null;
  if(k==='pages') return b.pages||null;
  return b[k]||null;
}
function filtered(){
  let list=books.slice();
  const q=state.q.trim().toLowerCase();
  if(q) list=list.filter(b=>`${b.title} ${b.author} ${b.genre} ${b.label}`.toLowerCase().includes(q));
  if(state.label) list=list.filter(b=>b.label===state.label);
  if(state.status!=='all') list=list.filter(b=>b.status===state.status);
  if(state.author) list=list.filter(b=>b.author===state.author);
  if(state.genre) list=list.filter(b=>b.genre===state.genre);
  if(state.minRating) list=list.filter(b=>(b.rating||0)>=state.minRating);
  const k=state.sort, d=state.dir==='asc'?1:-1;
  list.sort((a,b)=>{ const va=sortVal(a,k), vb=sortVal(b,k);
    if(va==null&&vb==null) return 0; if(va==null) return 1; if(vb==null) return -1;
    return (typeof va==='string' ? va.localeCompare(vb,'uk',{sensitivity:'base'}) : va-vb)*d; });
  return list;
}
function bookCard(b){
  return `<button class="card" onclick="openBook('${b.id}')">${coverHTML(b,'with-fav')}

}
function updateGrid(){
  const list=filtered(), g=$('#grid'); if(!g) return;
  $('#countLbl').textContent = list.length===books.length ? `${books.length} ${plural(books.length,'книга','книги','книг')}` : `Показано ${list.length} з ${books.length}`;
  if(!books.length){ g.innerHTML=`<div class="empty" style="grid-column:1/-1">Бібліотека порожня. Натисніть «+», щоб додати першу книгу.</div>`; return; }

}
function labelSuggestions(){ const u=uniq('label'); ['З Чехії','Подарунок'].forEach(x=>{ if(!u.some(y=>y.toLowerCase()===x.toLowerCase())) u.push(x); }); return u.slice(0,8); }
function uniq(field){ return [...new Set(books.map(b=>(b[field]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'uk')); }
function openFilters(){

    <div class="field"><label for="fR">Оцінка</label><select id="fR" class="inp">${opt('0','Будь-яка',String(state.minRating))}${[10,9,8,7,6,5].map(r=>opt(String(r),r===10?'Тільки 10':`від ${r} і вище`,String(state.minRating))).join('')}</select></div>
    <div class="field"><label for="fS">Сортувати за</label><select id="fS" class="inp">
      ${[['title','Назвою'],['author','Автором'],['rating','Оцінкою'],['startDate','Датою початку'],['endDate','Датою завершення'],['pages','Кількістю сторінок']].map(([v,l])=>opt(v,l,state.sort)).join('')}</select></div>

function bars(values, labels){
  const max=Math.max(1,...values);
  return `<div class="chart"><div class="bars">${values.map(v=>`<div><span class="v">${v?fmtNum(v):''}</span><i class="${v?'':'zero'}" style="height:${v?Math.max(4,v/max*100):2}%"></i></div>`).join('')}</div>

}
function statsHTML(){

    const years={}; allRead.forEach(b=>{ const y=(b.endDate||'').slice(0,4); if(y) { years[y]=years[y]||{c:0,p:0}; years[y].c++; years[y].p+=b.pages||0; } });

const sheets=[];
function openSheet({title='', left='Закрити', right='', onLeft, onRight}={}){
  const el=document.createElement('div'); el.className='sheet'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  el.innerHTML=`<div class="sheet-bar"><button class="bar-btn" data-l>${esc(left)}</button><div class="ttl">${esc(title)}</div>${right?`<button class="bar-btn r strong" data-r>${esc(right)}</button>`:'<span></span>'}</div><div class="sheet-body"></div>`;
  const s={el, body:el.querySelector('.sheet-body'), render:null};
  el.querySelector('[data-l]').onclick=()=> onLeft ? onLeft() : closeSheet(s);
  if(right) el.querySelector('[data-r]').onclick=()=> onRight && onRight();
  $('#sheets').appendChild(el); sheets.push(s); document.body.style.overflow='hidden';
  return s;

function closeSheet(s){ const i=sheets.indexOf(s); if(i>=0) sheets.splice(i,1); s.el.remove(); if(!sheets.length) document.body.style.overflow=''; }

/* Зберегти книгу. Якщо книга була «Читаю» і поточна сторінка змінилася —
   різниця записується в журнал за сьогодні (для «сторінок за день»). */
async function saveBook(b){
  const old=find(b.id); normalize(b);
  if(old && old.status==='reading' && (b.status==='reading'||b.status==='read')){
    const delta=(b.currentPage||0)-(old.currentPage||0), k=today();
    if(delta){ const v=Math.max(0,((b.log||{})[k]||0)+delta); b.log=b.log||{}; if(v) b.log[k]=v; else delete b.log[k]; }
  }
  await Store.put(b);
}
async function recordPage(id, v){
  const b=clone(find(id));
  if(isNaN(v)||v<0){ toast('Введіть номер сторінки'); return false; }
  if(b.pages && v>b.pages){ toast(`У книзі лише ${b.pages} сторінок`); return false; }
  const before=b.currentPage||0; b.currentPage=v;
  if(b.pages && v===b.pages && await askConfirm('Це остання сторінка. Позначити книгу як прочитану?','Так, дочитала')){ b.status='read'; b.endDate=today(); }
  await saveBook(b);
  toast(v>before ? `Записано: +${v-before} с.` : 'Прогрес збережено');
  return true;
}
function openRecord(id){
  const b=find(id); if(!b) return;

async function startReading(id){ const b=clone(find(id)); b.status='reading'; b.startDate=today(); b.currentPage=0; b.endDate=''; await saveBook(b); toast('Приємного читання!'); }
async function finishBook(id){ const b=clone(find(id)); b.status='read'; b.endDate=today(); await saveBook(b); toast('Книгу позначено як прочитану'); }
async function toggleFav(id){ const b=clone(find(id)); b.favorite=!b.favorite; await saveBook(b); }
async function setStatus(id,st){ const b=clone(find(id)); if(b.status===st) return;

/* ---------- Пошук книг у безкоштовних базах ---------- */
const ICON_SCAN=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>`;
const ICON_SEARCH=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;
const stripHtml = h => { const d=document.createElement('div'); d.innerHTML=String(h||''); return (d.textContent||'').trim(); };
function gThumb(l){ const u=l&&(l.thumbnail||l.smallThumbnail); return u ? u.replace(/^http:/,'https:').replace('&edge=curl','') : ''; }
function fromGoogle(v){
  const ids=v.industryIdentifiers||[]; const i13=ids.find(x=>x.type==='ISBN_13')||ids.find(x=>x.type==='ISBN_10');
  return { title:(v.title||'')+(v.subtitle?': '+v.subtitle:''), author:(v.authors||[]).join(', '), pages:v.pageCount||0,
    description:stripHtml(v.description).slice(0,4000), coverUrl:gThumb(v.imageLinks), isbn:i13?i13.identifier:'', year:(v.publishedDate||'').slice(0,4) };
}
async function getJSON(url){ const r=await fetch(url); if(!r.ok) throw new Error(r.status); return r.json(); }
async function lookupISBN(isbn){
  let res=null;
  try{ const j=await getJSON('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn); if(j.items&&j.items[0]) res=fromGoogle(j.items[0].volumeInfo); }catch(e){}
  if(!res || !res.pages || !res.coverUrl || !res.author){
    try{ const j=await getJSON(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`), o=j['ISBN:'+isbn];
      if(o){ res=res||{title:'',author:'',pages:0,description:'',coverUrl:''};
        res.title=res.title||((o.title||'')+(o.subtitle?': '+o.subtitle:''));
        res.author=res.author||(o.authors||[]).map(a=>a.name).join(', ');
        res.pages=res.pages||o.number_of_pages||0;
        res.coverUrl=res.coverUrl||((o.cover&&(o.cover.large||o.cover.medium))||'').replace(/^http:/,'https:'); } }catch(e){}
  }
  if(res && res.title){ res.isbn=isbn; return res; }
  return null;
}
/* обкладинку з інтернету зберігаємо в телефоні; якщо не виходить — зберігаємо посилання */
async function urlToCover(u){
  try{ const r=await fetch(u); const bl=await r.blob(); if(!bl.type.startsWith('image/')||bl.size<1500) throw 0; return await compressImage(bl); }
  catch(e){ return u; }
}
function cleanISBN(t){ const d=String(t||'').replace(/[^0-9Xx]/g,'').toUpperCase(); return (d.length===13&&/^97[89]/.test(d))||d.length===10 ? d : ''; }
function loadScript(src){ return new Promise((res,rej)=>{ if(window.ZXing) return res(); const el=document.createElement('script'); el.src=src; el.onload=res; el.onerror=rej; document.head.appendChild(el); }); }
const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
function makeReader(){
  const h=new Map(); h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A]); h.set(ZXing.DecodeHintType.TRY_HARDER,true);
  return new ZXing.BrowserMultiFormatReader(h);
}
function openScanner(onFound){
  let reader=null, done=false;
  const stop=()=>{ try{ reader&&reader.reset(); }catch(e){} };

  s.body.innerHTML=`<div class="in">
    <div class="scan-wrap"><video class="scan-video" id="scV" playsinline muted autoplay></video></div>

    <div class="status" id="scS" aria-live="polite">Вмикаю камеру…</div>
    <label class="btn btn-soft btn-wide" style="margin-top:16px;cursor:pointer">Сфотографувати штрихкод<input id="scP" type="file" accept="image/*" capture="environment" hidden></label>
    <div class="field" style="margin-top:20px"><label for="scI">Або введіть код ISBN вручну</label>
      <div class="pg-row" style="margin-top:0"><input class="inp" id="scI" inputmode="numeric" placeholder="978…" autocomplete="off"><button class="btn btn-primary" id="scGo">Знайти</button></div></div>
  </div>`;
  const q=x=>s.body.querySelector(x), st=m=>{ q('#scS').innerHTML=m; };
  async function handle(code){
    const isbn=cleanISBN(code);
    if(!isbn){ st('Це не схоже на код книги. Спробуйте ще раз.'); done=false; return; }
    done=true; stop(); st(`Код ${isbn}. Шукаю книгу…`);
    const r=await lookupISBN(isbn);
    if(r){ closeSheet(s); onFound(r); }
    else { st(`Книгу з кодом ${isbn} не знайдено в базах. Спробуйте <b>пошук за назвою</b> або заповніть вручну.`);
      const f=q('#scI'); f.value=isbn; done=false; }
  }
  q('#scGo').addEventListener('click',()=>handle(q('#scI').value));
  q('#scP').addEventListener('change',async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return;
    st('Читаю фото…');

/* ---------- Доповнення книг з інтернету ---------- */
const normT = t => String(t||'').toLowerCase().replace(/[«»"'’`.,:;!?()\-–—]/g,' ').replace(/\s+/g,' ').trim();
function titleMatches(a,b){ const x=normT(a), y=normT(b); if(!x||!y) return false; const n=Math.min(14,x.length,y.length); return x.startsWith(y.slice(0,n)) || y.startsWith(x.slice(0,n)); }
async function findBookInfo(b){
  const qs=[]; const t=b.title.replace(/[«»"]/g,'');
  if(b.author) qs.push(`intitle:${t} inauthor:${b.author.split(',')[0].split(' ').pop()}`);
  qs.push(t+(b.author?' '+b.author.split(',')[0]:''));
  for(const q of qs){
    try{
      const j=await getJSON('https://www.googleapis.com/books/v1/volumes?maxResults=10&printType=books&q='+encodeURIComponent(q));
      const items=(j.items||[]).map(i=>fromGoogle(i.volumeInfo)).filter(r=>titleMatches(r.title,b.title));
      if(items.length){
        /* найкращий варіант: з обкладинкою й сторінками */
        items.sort((x,y)=>((y.coverUrl?1:0)+(y.pages?1:0))-((x.coverUrl?1:0)+(x.pages?1:0)));
        const r={...items[0]};
        if(!r.pages) r.pages=(items.find(x=>x.pages)||{}).pages||0;
        if(!r.coverUrl) r.coverUrl=(items.find(x=>x.coverUrl)||{}).coverUrl||'';
        if((!r.coverUrl||!r.pages) && r.isbn){ const o=await lookupISBN(r.isbn); if(o){ r.coverUrl=r.coverUrl||o.coverUrl; r.pages=r.pages||o.pages; } }
        return r;
      }
    }catch(e){ if(String(e.message)==='429') throw e; }
    await sleep(250);
  }
  return null;
}
/* заповнює лише порожнє; нічого з того, що ви вже вписали, не перезаписує */
async function applyInfo(b, r, overwrite=false){
  let changed=false;
  if(r.pages && (overwrite || !b.pages)){ b.pages=r.pages; changed=true; }
  if(r.coverUrl && (overwrite || !b.cover)){ const c=await urlToCover(r.coverUrl); if(c){ b.cover=c; changed=true; } }
  if(r.description && !b.description){ b.description=r.description; changed=true; }
  if(r.author && !b.author){ b.author=r.author; changed=true; }
  if(r.isbn && !b.isbn){ b.isbn=r.isbn; changed=true; }
  if(b.status==='read' && b.pages) b.currentPage=b.pages;
  return changed;
}
let enriching=false, enrichMsg='';
async function enrichAll(statusEl){
  if(enriching) return; enriching=true;
  const todo=books.filter(b=>!b.cover||!b.pages).map(b=>b.id);
  let found=0, miss=[], i=0, limited=false;
  const say=m=>{ enrichMsg=m; const el=document.getElementById('enrichSt'); if(el) el.innerHTML=m; };
  try{
    for(const id of todo){
      i++; const b=clone(find(id)); if(!b) continue;
      say(`Шукаю ${i} з ${todo.length}: «${esc(b.title)}»…`);
      let r=null;
      try{ r=await findBookInfo(b); }catch(e){ limited=true; break; }
      if(r && await applyInfo(b,r)){ normalize(b,false); await Store.put(b,true); found++; } else miss.push(b.title);
      if(i%5===0) refresh();
      await sleep(300);
    }
  } finally { enriching=false; }
  const msg = limited ? `Доповнено ${found} ${plural(found,'книгу','книги','книг')}. База книг тимчасово обмежила кількість запитів: зачекайте годину й натисніть ще раз, знайдене вже збережено.` : `Готово: доповнено ${found} ${plural(found,'книгу','книги','книг')}.` + (miss.length?` Не знайдено ${miss.length}: для них відкрийте книгу й натисніть «Знайти обкладинку й сторінки».`:'');
  enrichMsg=msg; refresh(); say(msg); toast(`Доповнено ${found} ${plural(found,'книгу','книги','книг')}`);
}
function findForBook(id){
  const b=find(id); if(!b) return;
  openSearch(async r=>{
    const c=clone(find(id)); toast('Завантажую…');
    await applyInfo(c,r,true); await saveBook(c); toast('Дані книги оновлено');
  }, (b.title+' '+(b.author||'')).trim());
}

function compressImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(); fr.onload=()=>{
      const img=new Image(); img.onerror=()=>rej();
      img.onload=()=>{
        const enc=(max,qual)=>{ const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
          const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',qual); };
        let out=enc(720,.78); if(out.length>180000) out=enc(560,.66); if(out.length>180000) out=enc(420,.6);
        res(out);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      </div></div>`;
    s.body.querySelector('#thm').addEventListener('click',e=>{ const b=e.target.closest('[data-t]'); if(!b) return;
      setPref('lib-theme',b.dataset.t); applyLook(); s.render(); });
    s.body.querySelector('#enrichBtn').addEventListener('click',e=>{ e.target.disabled=true; enrichAll(s.body.querySelector('#enrichSt')); });
    s.body.querySelector('#sinceIn').addEventListener('change',e=>{ const v=e.target.value; if(/^\d{4}-\d{2}$/.test(v)){ try{ localStorage.setItem('lib-since',v); }catch(err){} refresh(); toast('Збережено'); } });
    s.body.querySelector('#dF').addEventListener('change',e=>{ setPref('lib-dfont',e.target.value); applyLook(); });
    s.body.querySelector('#bF').addEventListener('change',e=>{ setPref('lib-bfont',e.target.value); applyLook(); });
  };
  s.render();
}
async function saveFile(name, blob){
  if(DL){
    try{ await DL.save({filename:name, data:blob}); return true; }
    catch(e){ const c=e&&e.code; if(c==='declined') return false;
      if(c==='rate_limited'){ toast('Зачекайте кілька секунд і спробуйте ще раз'); return false; } }
  }
  try{ const file=new File([blob],name,{type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return true; } }
  catch(e){ if(e&&e.name==='AbortError') return false; }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },3000); return true; }
  catch(e){ toast('Не вдалося зберегти файл'); return false; }
}
async function exportJSON(){
  const data={ app:'moya-biblioteka', schemaVersion:SCHEMA_VERSION, exportedAt:new Date().toISOString(), count:books.length, books };
  const ok=await saveFile(`biblioteka-${today()}.json`, new Blob([JSON.stringify(data)],{type:'application/json'}));
  if(ok){ await Store.setMeta({lastBackup:new Date().toISOString()}); refresh(); toast('Резервну копію збережено'); }
}
async function exportCSV(){
  const cols=[['Назва','title'],['Автор','author'],['Жанр','genre'],['Примітка','label'],['Сторінок','pages'],['Поточна сторінка','currentPage'],['Прогрес %',b=>pct(b)],
    ['Статус',b=>STATUS[b.status]],['Дата початку','startDate'],['Дата завершення','endDate'],['Оцінка','rating'],['Улюблена',b=>b.favorite?'так':''],['Опис','description'],['Нотатки','notes'],['Цитати',b=>(b.quotes||[]).map(q=>q.text+(q.page?` (с. ${q.page})`:'')).join(' | ')]];
  const cell=v=>{ const s=String(v??''); return /[",;\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const rows=[cols.map(c=>c[0]).join(','), ...books.map(b=>cols.map(([,k])=>cell(typeof k==='function'?k(b):b[k])).join(','))];
  const ok=await saveFile(`biblioteka-${today()}.csv`, new Blob(['\uFEFF'+rows.join('\r\n')],{type:'text/csv'}));
  if(ok) toast('Таблицю збережено');
}
function pickImport(){ $('#importInput').click(); }
$('#importInput').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  let data; try{ data=JSON.parse(await f.text()); }catch(err){ toast('Це не файл експорту бібліотеки (потрібен .json)'); return; }
  const list=(Array.isArray(data)?data:data&&data.books)||[];
  const valid=list.filter(x=>x&&typeof x==='object'&&typeof x.title==='string'&&x.title.trim());
  if(!valid.length){ toast('У файлі не знайдено жодної книги'); return; }
  if(!await askConfirm(`У файлі ${valid.length} ${plural(valid.length,'книга','книги','книг')}. Додати до бібліотеки?`,'Імпортувати')) return;
  let done=0;
  for(const x of valid){
    const b=Object.assign(blankBook(), x);
    if(typeof b.id!=='string' || !/^[A-Za-z0-9_-]{1,60}$/.test(b.id)) b.id=newId();
    ['title','author','genre','label','description','notes','startDate','endDate'].forEach(k=>{ b[k]=String(b[k]??'').slice(0,20000); });
    if(!/^\d{4}-\d{2}-\d{2}$/.test(b.startDate)) b.startDate=''; if(!/^\d{4}-\d{2}-\d{2}$/.test(b.endDate)) b.endDate='';
    if(typeof b.cover==='string' && b.cover.length>240000) b.cover='';
    const createdAt=b.createdAt; normalize(b,false); if(createdAt) b.createdAt=createdAt;
    try{ await Store.put(b,true); done++; }catch(err){ break; }
    if(done%10===0) toast(`Імпортовано ${done} з ${valid.length}…`);
  }
  refresh(); toast(`Готово: імпортовано ${done} ${plural(done,'книгу','книги','книг')}`);
});

Store.init();
</script>
